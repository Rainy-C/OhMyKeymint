name: Build OhMyKeymint

on:
  push:
    tags:
      - '*'
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.github/**'
      - '!.github/workflows/**'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-boringssl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Clone BoringSSL
      run: |
        git clone https://boringssl.googlesource.com/boringssl

    - name: Cache BoringSSL build
      uses: actions/cache@v6
      id: boringssl-cache
      with:
        path: boringssl/build
        key: boringssl-${{ hashFiles('boringssl/.git/HEAD', 'boringssl/.git/refs/heads/main') }}

    - name: Install Rust toolchain
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        target: aarch64-linux-android

    - name: Install Android SDK
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Install Android NDK and bindgen
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      run: |
        cargo install bindgen-cli
        echo "y" | sdkmanager --install "ndk;30.0.16248370" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
        echo "y" | sdkmanager --install "ndk-bundle" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
        echo "y" | sdkmanager --install "cmake;4.1.2" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null

    - name: Install build dependencies
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gcc-multilib

    - name: Build BoringSSL
      if: steps.boringssl-cache.outputs.cache-hit != 'true'
      run: |
        cd boringssl
        export PATH="~/.cargo/bin:$PATH"
        $ANDROID_SDK_ROOT/cmake/4.1.2/bin/cmake -GNinja -B build \
          -DRUST_BINDINGS=aarch64-linux-android \
          -DCMAKE_SYSROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/sysroot/ \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/30.0.16248370/build/cmake/android.toolchain.cmake \
          -DCMAKE_C_FLAGS=-mno-outline-atomics \
          -DCMAKE_CXX_FLAGS=-mno-outline-atomics \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-33
        ninja -j$(nproc) -C build
    - name: Tar BoringSSL
      run: |
        tar czf boringssl.tar.gz boringssl/build boringssl/rust
    
    - name: Output BoringSSL
      uses: actions/upload-artifact@v7
      with:
        name: boringssl.tar.gz
        path: boringssl.tar.gz
        retention-days: 3

  lint:
    runs-on: ubuntu-latest
    needs: build-boringssl
    permissions:
      contents: read
    env:
      BORINGSSL_BUILD_DIR: ${{ github.workspace }}/boringssl/build
      CARGO_HUSKY_DONT_INSTALL_HOOKS: '1'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        target: aarch64-linux-android
        components: rustfmt, clippy

    - name: Install cargo-deny
      run: cargo install cargo-deny --locked

    - name: Install Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools

    - name: Install Android build dependencies
      run: |
        sdkmanager --install "ndk;30.0.16248370" "build-tools;37.0.0" --sdk_root="$ANDROID_SDK_ROOT"
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Download BoringSSL
      uses: actions/download-artifact@v8
      with:
        name: boringssl.tar.gz
        path: .

    - name: Configure Cargo for Android target
      run: |
        tar xf boringssl.tar.gz
        python scripts/setup_cargo_config.py \
          --force \
          --ndk-root "$ANDROID_SDK_ROOT/ndk/30.0.16248370" \
          --host-tag linux-x86_64
        cat >> .cargo/config.toml <<EOF

        [patch.crates-io]
        bssl-sys = { path = "$GITHUB_WORKSPACE/boringssl/rust/bssl-sys" }
        EOF

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Check Clippy
      run: cargo clippy --target aarch64-linux-android --workspace --all-targets -- -D warnings

    - name: Check dependencies
      run: cargo deny --workspace check

  setup-and-build:
    runs-on: ubuntu-latest
    needs:
      - build-boringssl
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        build-type: [release]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        target: aarch64-linux-android
        components: rustfmt, clippy

    - name: Cache Cargo registry and build artifacts
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Install Android NDK
      run: |
        echo "y" | sdkmanager --install "ndk;30.0.16248370" "build-tools;37.0.0" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
    - name: Install protoc
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Download BoringSSL
      uses: actions/download-artifact@v8
      with:
        name: boringssl.tar.gz
        path: .

    - name: Configure Cargo for Android target
      run: |
        tar xf boringssl.tar.gz
        python scripts/setup_cargo_config.py \
          --force \
          --ndk-root "$ANDROID_SDK_ROOT/ndk/30.0.16248370" \
          --host-tag linux-x86_64
        cat >> .cargo/config.toml <<EOF

        [patch.crates-io]
        bssl-sys = { path = "$GITHUB_WORKSPACE/boringssl/rust/bssl-sys" }
        EOF

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install toml

    - name: Build OhMyKeymint
      id: prepareArtifact
      env:
        BORINGSSL_BUILD_DIR: ${{ github.workspace }}/boringssl/build
      run: |
        unset RUSTFLAGS
        python build.py --${{ matrix.build-type }}
        name=`ls target/OhMyKeymint-* | awk -F '(/|.zip)' '{print $2}'` && echo "releaseName=$name" >> $GITHUB_OUTPUT
        unzip target/OhMyKeymint-*.zip -d module-${{ matrix.build-type }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      id: upload
      with:
        name: ${{ steps.prepareArtifact.outputs.releaseName }}
        path: "./module-${{ matrix.build-type }}/*"
        retention-days: 90

    - name: Attest release build provenance
      if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.build-type == 'release' }}
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{ steps.prepareArtifact.outputs.releaseName }}
        subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}

    - name: Publish fork release
      if: github.repository == 'Rainy-C/OhMyKeymint' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        packages=(target/OhMyKeymint-release-arm64-v8a-*.zip)
        test "${#packages[@]}" -eq 1
        package=${packages[0]}
        name=${package##*/}
        properties=$(unzip -p "$package" module.prop)
        version=$(sed -n 's/^version=//p' <<< "$properties")
        code=$(sed -n 's/^versionCode=//p' <<< "$properties")
        tag="snowmint-$version"
        base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        if gh release view "$tag" >/dev/null 2>&1; then
          exit 0
        fi
        printf '%s\n' '新增中文 Material Design 3 WebUI，支持查看守护进程、配置文件状态和重启服务。' > "$RUNNER_TEMP/changelog.md"
        jq -n --arg version "$version" --argjson versionCode "$code" \
          --arg zipUrl "$base/releases/download/$tag/$name" \
          --arg changelog "$base/releases/download/$tag/changelog.md" \
          '{version: $version, versionCode: $versionCode, zipUrl: $zipUrl, changelog: $changelog}' > "$RUNNER_TEMP/update.json"
        gh release create "$tag" "$package" "$RUNNER_TEMP/update.json" "$RUNNER_TEMP/changelog.md" \
          --target "$GITHUB_SHA" --title "SnowMint $version" --notes-file "$RUNNER_TEMP/changelog.md" --latest
